# EMS phone ↔ web sync: writes one heartbeat row to Supabase every day, so the free project is never paused for
# inactivity. Reads the Project URL and Publishable key from js/ems-sync-config.js (public values). Does nothing until
# that file is filled in. Run it by hand any time: GitHub → Actions → this workflow → Run workflow.
name: EMS sync - keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write today's heartbeat
        run: |
          URL=$(sed -n "s/^ *url:'\(.*\)',*$/\1/p" js/ems-sync-config.js | head -1)
          KEY=$(sed -n "s/^ *key:'\(.*\)',*$/\1/p" js/ems-sync-config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "The sync is not set up yet (js/ems-sync-config.js is empty). Nothing to do."; exit 0; fi
          curl -sS --fail-with-body -X POST "$URL/rest/v1/ems_heartbeat" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"id\":1,\"note\":\"daily $(date -u +%F)\"}"
          echo "Heartbeat written."
